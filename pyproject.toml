[project]
name = "wahni_kseb"
authors = [
    { name = "Wahni", email = "mujeebcpy@wahni.io"}
]
description = "KSEB data integration and solar grid availability"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "kseb-client @ git+https://github.com/mujeebcpy/kseb-client.git@v1.0.0",
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
